name: Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package_variant: [ apt-android-7 ]

    steps:
      - name: Clone repository
        uses: actions/checkout@v6

      - name: Validate shell scripts & test agy_patch.c
        run: |
          bash -n app/src/main/assets/agy_bridge/start_hub.sh
          bash -n app/src/main/assets/agy_bridge/dpkg_wrap.sh
          bash -n app/src/main/assets/agy_bridge/xdg-open
          gcc -O2 -std=c11 -Wall -Wextra -Werror tools/agy_patch.c -o /tmp/agy_patch_host
          python3 tools/test_agy_patch.py /tmp/agy_patch_host

      - name: Setup java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK & NDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;36.0.0 ndk;29.0.14206865'

      - name: Cross-compile libzstd_cli.so and libagy_patch.so (64-bit ABIs)
        run: |
          NDK_BIN="$ANDROID_HOME/ndk/29.0.14206865/toolchains/llvm/prebuilt/linux-x86_64/bin"
          STRIP="$NDK_BIN/llvm-strip"
          curl -fsSL -o /tmp/zstd.tar.gz "https://github.com/facebook/zstd/releases/download/v1.5.7/zstd-1.5.7.tar.gz"
          echo "eb33e51f49a15e023950cd7825ca74a4a2b43db8354825ac24fc1b7ee09e6fa3  /tmp/zstd.tar.gz" | sha256sum -c -
          tar -xzf /tmp/zstd.tar.gz -C /tmp
          cd /tmp/zstd-1.5.7

          build_zstd() {
            local abi="$1"
            local cc="$2"
            "$cc" -O2 -fPIE -pie -pthread -DZSTD_MULTITHREAD -DZSTD_NOBENCH -DZSTD_NODICT -DZSTD_DISABLE_ASM \
              -Ilib -Ilib/common -Ilib/compress -Ilib/decompress -Iprograms \
              lib/common/*.c lib/compress/*.c lib/decompress/*.c \
              programs/zstdcli.c programs/zstdcli_trace.c programs/util.c programs/timefn.c programs/fileio.c programs/fileio_asyncio.c \
              -o "/tmp/libzstd_cli_${abi}.so"
            "$STRIP" "/tmp/libzstd_cli_${abi}.so"
            mkdir -p "$GITHUB_WORKSPACE/app/src/main/jniLibs/${abi}"
            cp "/tmp/libzstd_cli_${abi}.so" "$GITHUB_WORKSPACE/app/src/main/jniLibs/${abi}/libzstd_cli.so"
          }

          build_zstd "arm64-v8a" "$NDK_BIN/aarch64-linux-android24-clang"
          build_zstd "x86_64" "$NDK_BIN/x86_64-linux-android24-clang"

          build_patcher() {
            local abi="$1"
            local cc="$2"
            "$cc" -O2 -std=c11 -Wall -Wextra -Werror -fPIE -pie \
              "$GITHUB_WORKSPACE/tools/agy_patch.c" \
              -o "/tmp/libagy_patch_${abi}.so"
            "$STRIP" "/tmp/libagy_patch_${abi}.so"
            cp "/tmp/libagy_patch_${abi}.so" "$GITHUB_WORKSPACE/app/src/main/jniLibs/${abi}/libagy_patch.so"
          }

          build_patcher "arm64-v8a" "$NDK_BIN/aarch64-linux-android24-clang"
          build_patcher "x86_64" "$NDK_BIN/x86_64-linux-android24-clang"

      - name: Build APKs
        shell: bash {0}
        env:
          PACKAGE_VARIANT: ${{ matrix.package_variant }}
        run: |
          exit_on_error() { echo "$1"; exit 1; }

          echo "Setting vars"

          if [ "$GITHUB_EVENT_NAME" == "pull_request" ]; then
              GITHUB_SHA="${{ github.event.pull_request.head.sha }}" # Do not use last merge commit set in GITHUB_SHA
          fi

          # Set RELEASE_VERSION_NAME to "<CURRENT_VERSION_NAME>+<last_commit_hash>"
          CURRENT_VERSION_NAME_REGEX='\s+versionName "([^"]+)"$'
          CURRENT_VERSION_NAME="$(grep -m 1 -E "$CURRENT_VERSION_NAME_REGEX" ./app/build.gradle | sed -r "s/$CURRENT_VERSION_NAME_REGEX/\1/")"
          RELEASE_VERSION_NAME="v$CURRENT_VERSION_NAME+${GITHUB_SHA:0:7}" # The "+" is necessary so that versioning precedence is not affected
          if ! printf "%s" "${RELEASE_VERSION_NAME/v/}" | grep -qP '^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-((?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*)(?:\.(?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*))*))?(?:\+([0-9a-zA-Z-]+(?:\.[0-9a-zA-Z-]+)*))?$'; then
           exit_on_error "The versionName '${RELEASE_VERSION_NAME/v/}' is not a valid version as per semantic version '2.0.0' spec in the format 'major.minor.patch(-prerelease)(+buildmetadata)'. https://semver.org/spec/v2.0.0.html."
          fi

          APK_DIR_PATH="./app/build/outputs/apk/debug"
          APK_VERSION_TAG="$RELEASE_VERSION_NAME-${{ env.PACKAGE_VARIANT }}-github-debug"
          APK_BASENAME_PREFIX="antigravity-debug"

          # Used by attachment steps later
          echo "APK_DIR_PATH=$APK_DIR_PATH" >> $GITHUB_ENV
          echo "APK_VERSION_TAG=$APK_VERSION_TAG" >> $GITHUB_ENV
          echo "APK_BASENAME_PREFIX=$APK_BASENAME_PREFIX" >> $GITHUB_ENV

          echo "Building APKs for '$APK_VERSION_TAG' build"
          export TERMUX_APP_VERSION_NAME="${RELEASE_VERSION_NAME/v/}"
          export TERMUX_APK_VERSION_TAG="$APK_VERSION_TAG"
          export TERMUX_PACKAGE_VARIANT="${{ env.PACKAGE_VARIANT }}"
          chmod +x gradlew
          if ! ./gradlew :app:assembleDebug --no-daemon; then
            exit_on_error "Build failed for '$APK_VERSION_TAG' build."
          fi

          echo "Validating APKs"
          for abi in universal arm64-v8a x86_64; do
            if ! ls "$APK_DIR_PATH"/*"$abi"*.apk >/dev/null 2>&1; then
              files_found="$(ls "$APK_DIR_PATH")"
              exit_on_error "Failed to find built APK for $abi in '$APK_DIR_PATH'. Files found: "$'\n'"$files_found"
            fi
          done

          echo "Generating sha25sums file"
          if ! (cd "$APK_DIR_PATH" && sha256sum *.apk > "${APK_BASENAME_PREFIX}_sha256sums"); then
            exit_on_error "Generate sha25sums failed for '$APK_VERSION_TAG' release."
          fi

      - name: Attach debug APKs and checksums
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_BASENAME_PREFIX }}-${{ github.sha }}
          path: |
            ${{ env.APK_DIR_PATH }}/*.apk
            ${{ env.APK_DIR_PATH }}/${{ env.APK_BASENAME_PREFIX }}_sha256sums
            ${{ env.APK_DIR_PATH }}/output-metadata.json
