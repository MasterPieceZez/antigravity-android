name: Unit tests

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  testing:
    runs-on: ubuntu-latest
    steps:
      - name: Clone repository
        uses: actions/checkout@v4

      - name: Validate shell scripts & test agy_patch.c
        run: |
          bash -n app/src/main/assets/agy_bridge/start_hub.sh
          bash -n app/src/main/assets/agy_bridge/dpkg_wrap.sh
          gcc -O2 -std=c11 -Wall -Wextra -Werror tools/agy_patch.c -o /tmp/agy_patch_host
          python3 tools/test_agy_patch.py /tmp/agy_patch_host

      - name: Setup java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK & NDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;36.0.0 ndk;29.0.14206865'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Execute unit tests
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest :terminal-emulator:test --no-daemon
