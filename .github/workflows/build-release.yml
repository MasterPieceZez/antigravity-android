name: Build Antigravity Android APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

jobs:
  build-arm64:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK & NDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;36.0.0 ndk;29.0.14206865'

      - name: Cross-compile arm64-v8a libzstd_cli.so
        run: |
          NDK_BIN="$ANDROID_HOME/ndk/29.0.14206865/toolchains/llvm/prebuilt/linux-x86_64/bin"
          CC="$NDK_BIN/aarch64-linux-android28-clang"
          STRIP="$NDK_BIN/llvm-strip"
          curl -fsSL -o /tmp/zstd.tar.gz "https://github.com/facebook/zstd/releases/download/v1.5.7/zstd-1.5.7.tar.gz"
          tar -xzf /tmp/zstd.tar.gz -C /tmp
          cd /tmp/zstd-1.5.7
          "$CC" -O2 -fPIE -pie -pthread -DZSTD_MULTITHREAD -DZSTD_NOBENCH -DZSTD_NODICT \
            -Ilib -Ilib/common -Ilib/compress -Ilib/decompress -Iprograms \
            lib/common/*.c lib/compress/*.c lib/decompress/*.c \
            programs/zstdcli.c programs/zstdcli_trace.c programs/util.c programs/timefn.c programs/fileio.c programs/fileio_asyncio.c \
            -o /tmp/libzstd_cli.so
          "$STRIP" /tmp/libzstd_cli.so
          mkdir -p "$GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a"
          cp /tmp/libzstd_cli.so "$GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a/libzstd_cli.so"

      - name: Decode Release Keystore (if configured)
        if: ${{ secrets.AGY_KEYSTORE_BASE64 != '' }}
        run: |
          echo "${{ secrets.AGY_KEYSTORE_BASE64 }}" | base64 -d > /tmp/release.jks
          echo "AGY_KEYSTORE_PATH=/tmp/release.jks" >> "$GITHUB_ENV"

      - name: Build Full ARM64 Release APK
        env:
          AGY_KEYSTORE_PASSWORD: ${{ secrets.AGY_KEYSTORE_PASSWORD }}
          AGY_KEY_ALIAS: ${{ secrets.AGY_KEY_ALIAS }}
          AGY_KEY_PASSWORD: ${{ secrets.AGY_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon

      - name: Verify APK with aapt2
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -n 1)
          "$ANDROID_HOME/build-tools/36.0.0/aapt2" dump badging "$APK" | grep -E "package:|targetSdkVersion:|native-code:"
          ls -lh "$APK"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AntigravityStandalone-arm64
          path: app/build/outputs/apk/release/*.apk
