name: Build Antigravity Android APK

on:
  push:
    branches: [ main, master, 'dev/**' ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate shell scripts & test agy_patch.c
        run: |
          bash -n app/src/main/assets/agy_bridge/start_hub.sh
          bash -n app/src/main/assets/agy_bridge/dpkg_wrap.sh
          bash -n app/src/main/assets/agy_bridge/xdg-open
          gcc -O2 -std=c11 -Wall -Wextra -Werror tools/agy_patch.c -o /tmp/agy_patch_host
          python3 tools/test_agy_patch.py /tmp/agy_patch_host

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK & NDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;36.0.0 ndk;29.0.14206865'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run Android Unit Tests
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest :terminal-emulator:test --no-daemon

  build-apk:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        include:
          - variant: standalone
            lite: 'false'
          - variant: lite
            lite: 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK & NDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;36.0.0 ndk;29.0.14206865'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Cache native tools (libzstd_cli.so & libagy_patch.so)
        id: cache-native
        uses: actions/cache@v4
        with:
          path: app/src/main/jniLibs
          key: native-tools-zstd1.5.7-${{ hashFiles('tools/agy_patch.c', '.github/workflows/build-release.yml') }}

      - name: Cross-compile libzstd_cli.so and libagy_patch.so (64-bit ABIs)
        if: steps.cache-native.outputs.cache-hit != 'true'
        run: |
          NDK_BIN="$ANDROID_HOME/ndk/29.0.14206865/toolchains/llvm/prebuilt/linux-x86_64/bin"
          STRIP="$NDK_BIN/llvm-strip"
          curl -fsSL -o /tmp/zstd.tar.gz "https://github.com/facebook/zstd/releases/download/v1.5.7/zstd-1.5.7.tar.gz"
          echo "eb33e51f49a15e023950cd7825ca74a4a2b43db8354825ac24fc1b7ee09e6fa3  /tmp/zstd.tar.gz" | sha256sum -c -
          tar -xzf /tmp/zstd.tar.gz -C /tmp
          cd /tmp/zstd-1.5.7

          build_zstd() {
            local abi="$1"
            local cc="$2"
            "$cc" -O2 -fPIE -pie -pthread -DZSTD_MULTITHREAD -DZSTD_NOBENCH -DZSTD_NODICT -DZSTD_DISABLE_ASM \
              -Ilib -Ilib/common -Ilib/compress -Ilib/decompress -Iprograms \
              lib/common/*.c lib/compress/*.c lib/decompress/*.c \
              programs/zstdcli.c programs/zstdcli_trace.c programs/util.c programs/timefn.c programs/fileio.c programs/fileio_asyncio.c \
              -o "/tmp/libzstd_cli_${abi}.so"
            "$STRIP" "/tmp/libzstd_cli_${abi}.so"
            mkdir -p "$GITHUB_WORKSPACE/app/src/main/jniLibs/${abi}"
            cp "/tmp/libzstd_cli_${abi}.so" "$GITHUB_WORKSPACE/app/src/main/jniLibs/${abi}/libzstd_cli.so"
          }

          build_zstd "arm64-v8a" "$NDK_BIN/aarch64-linux-android24-clang"
          build_zstd "x86_64" "$NDK_BIN/x86_64-linux-android24-clang"

          build_patcher() {
            local abi="$1"
            local cc="$2"
            "$cc" -O2 -std=c11 -Wall -Wextra -Werror -fPIE -pie \
              "$GITHUB_WORKSPACE/tools/agy_patch.c" \
              -o "/tmp/libagy_patch_${abi}.so"
            "$STRIP" "/tmp/libagy_patch_${abi}.so"
            cp "/tmp/libagy_patch_${abi}.so" "$GITHUB_WORKSPACE/app/src/main/jniLibs/${abi}/libagy_patch.so"
          }

          build_patcher "arm64-v8a" "$NDK_BIN/aarch64-linux-android24-clang"
          build_patcher "x86_64" "$NDK_BIN/x86_64-linux-android24-clang"

      - name: Cache Termux bootstraps
        if: matrix.lite == 'false'
        id: cache-bootstrap
        uses: actions/cache@v4
        with:
          path: |
            app/src/main/cpp/bootstrap-*.orig.zip
            app/src/main/cpp/bootstrap-*.zip
          key: termux-bootstrap-${{ hashFiles('app/build.gradle') }}

      - name: Refresh patched bootstrap timestamps on cache hit
        if: matrix.lite == 'false' && steps.cache-bootstrap.outputs.cache-hit == 'true'
        run: |
          for f in app/src/main/cpp/bootstrap-aarch64.zip app/src/main/cpp/bootstrap-x86_64.zip; do
            if [ -f "$f" ]; then
              touch "$f"
            fi
          done

      - name: Decode or Generate CI Release Keystore
        env:
          AGY_KEYSTORE_BASE64: ${{ secrets.AGY_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$AGY_KEYSTORE_BASE64" ]; then
            echo "$AGY_KEYSTORE_BASE64" | base64 -d > /tmp/release.jks
            echo "AGY_KEYSTORE_PATH=/tmp/release.jks" >> "$GITHUB_ENV"
          elif [[ "${GITHUB_REF:-}" == refs/tags/v* ]]; then
            echo "::error::AGY_KEYSTORE_BASE64 secret is required for tagged releases to preserve in-place update signatures."
            exit 1
          elif [ ! -f app/testkey_untrusted.jks ]; then
            keytool -genkeypair -v -keystore /tmp/ci-release.jks -storetype JKS \
              -keyalg RSA -keysize 2048 -validity 10000 -alias antigravity \
              -storepass antigravity-ci -keypass antigravity-ci \
              -dname "CN=Antigravity Android, O=OpenSource, C=US"
            echo "AGY_KEYSTORE_PATH=/tmp/ci-release.jks" >> "$GITHUB_ENV"
            echo "CI_KEYSTORE_PASSWORD=antigravity-ci" >> "$GITHUB_ENV"
            echo "CI_KEYSTORE_ALIAS=antigravity" >> "$GITHUB_ENV"
            echo "CI_KEYSTORE_KEY_PASS=antigravity-ci" >> "$GITHUB_ENV"
          fi

      - name: Build ${{ matrix.variant }} Release APK(s)
        env:
          AGY_KEYSTORE_PASSWORD: ${{ secrets.AGY_KEYSTORE_PASSWORD || env.CI_KEYSTORE_PASSWORD }}
          AGY_KEY_ALIAS: ${{ secrets.AGY_KEY_ALIAS || env.CI_KEYSTORE_ALIAS }}
          AGY_KEY_PASSWORD: ${{ secrets.AGY_KEY_PASSWORD || env.CI_KEYSTORE_KEY_PASS }}
        run: |
          chmod +x gradlew
          mkdir -p dist
          if [ "${{ matrix.lite }}" = "true" ]; then
            ./gradlew :app:assembleRelease -PagyLiteUpdate=true --no-daemon
            cp app/build/outputs/apk/release/AntigravityUpdate-*-lite.apk dist/
          else
            ./gradlew :app:assembleRelease --no-daemon
            cp app/build/outputs/apk/release/AntigravityStandalone-*.apk dist/
          fi

      - name: Verify APKs with aapt2
        run: |
          for APK in dist/*.apk; do
            echo "=== $APK ==="
            "$ANDROID_HOME/build-tools/36.0.0/aapt2" dump badging "$APK" | grep -E "package:|application-label:|targetSdkVersion:|native-code:" || true
          done
          ls -lh dist/

      - name: Upload ${{ matrix.variant }} APKs
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.variant }}
          path: dist/*.apk

  publish:
    needs: [ unit-tests, build-apk ]
    runs-on: ubuntu-latest
    steps:
      - name: Download built APKs
        uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist

      - name: Generate Checksums
        run: |
          (cd dist && sha256sum *.apk > SHA256SUMS.txt && cat SHA256SUMS.txt)
          ls -lh dist/
          echo "SAFE_REF=${GITHUB_REF_NAME//\//-}" >> "$GITHUB_ENV"

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Antigravity-${{ env.SAFE_REF }}-APKs
          path: dist/*

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          EXPECTED_VER="${TAG#v}"
          if ! ls dist/AntigravityUpdate-v"${EXPECTED_VER}"-*-lite.apk >/dev/null 2>&1; then
            echo "::error::Tag ${TAG} does not match built APK versionName in app/build.gradle"
            exit 1
          fi
          cd dist
          PRERELEASE_FLAG=""
          TITLE="$TAG"
          if [[ "$EXPECTED_VER" == *-* ]]; then
            PRERELEASE_FLAG="--prerelease"
            TITLE="$TAG (Super Unstable Beta)"
          fi
          : > release_notes.md
          if [[ "$EXPECTED_VER" == *-* ]]; then
            cat >> release_notes.md <<'EOF'
          > [!WARNING]
          > **SUPER UNSTABLE BETA (__TAG__):** This pre-release build is experimental and may contain bugs or breaking issues. Use for testing only and create a Full Backup in Control Center before updating.

          EOF
          fi
          cat >> release_notes.md <<'EOF'
          ## Antigravity for Android (__TAG__)

          Standalone 64-bit Android build for Google Antigravity (`arm64-v8a`, `x86_64`, and `universal`).

          - **Fresh install:** `AntigravityStandalone-__TAG__-arm64-v8a.apk` (recommended for most devices), `x86_64`, or `universal`.
          - **In-place update (already installed):** `AntigravityUpdate-__TAG__-universal-lite.apk` (keeps your existing environment intact).

          ### SHA-256 Checksums
          ```
          EOF
          sed -i "s/__TAG__/${TAG}/g" release_notes.md
          cat SHA256SUMS.txt >> release_notes.md
          echo '```' >> release_notes.md

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TITLE" --notes-file release_notes.md $PRERELEASE_FLAG
            gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" *.apk SHA256SUMS.txt --clobber
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" *.apk SHA256SUMS.txt --title "$TITLE" --notes-file release_notes.md $PRERELEASE_FLAG
          fi
