name: "Bug report"
description: "Report a bug in Antigravity for Android"
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Please search existing issues before opening a new one.
        Do not include OAuth tokens, `bridge.token`, or personal credentials in logs.
  - type: textarea
    attributes:
      label: Problem description
      description: A clear and concise description of what happened. Attach screenshots or redacted logs from Control Center -> Hub Logs if applicable.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Steps to reproduce
      description: Exact steps to reproduce the issue.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Expected behavior
      description: What you expected to happen.
  - type: textarea
    attributes:
      label: Device & App information
      description: Please fill in your environment details
      value: |
        * App version & APK type (Standalone / Lite):
        * Android version:
        * Device model & ABI (arm64-v8a / x86_64):
        * Antigravity CLI installed via (Auto-install / Termux Port):
    validations:
      required: true
