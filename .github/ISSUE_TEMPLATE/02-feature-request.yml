name: "Feature request"
description: "Suggest a new feature or improvement for Antigravity for Android"
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    attributes:
      label: Feature description
      description: Describe the feature or improvement and the problem it solves.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Additional context
      description: Any screenshots, workflows, or references that help explain the idea.
    validations:
      required: false
