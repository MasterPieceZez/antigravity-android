plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
}

ext {
    packageVariant = System.getenv("TERMUX_PACKAGE_VARIANT") ?: "apt-android-7"
    liteUpdate = project.hasProperty("agyLiteUpdate") && project.property("agyLiteUpdate").toString() == "true"
}

android {
    namespace "com.termux"

    compileSdkVersion project.properties.compileSdkVersion.toInteger()
    ndkVersion = System.getenv("JITPACK_NDK_VERSION") ?: project.properties.ndkVersion

    dependencies {
        implementation "androidx.annotation:annotation:1.9.0"
        implementation "androidx.browser:browser:1.8.0"
        implementation "androidx.webkit:webkit:1.12.1"
        implementation "androidx.core:core:1.13.1"
        implementation "androidx.core:core-ktx:1.13.1"
        implementation "androidx.activity:activity-ktx:1.9.3"
        implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.8.7"
        implementation "androidx.drawerlayout:drawerlayout:1.2.0"
        implementation "androidx.preference:preference:1.2.1"
        implementation "androidx.viewpager:viewpager:1.0.0"
        implementation "com.google.android.material:material:1.12.0"
        implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0"
        implementation "com.google.guava:guava:24.1-jre"
        implementation "io.noties.markwon:core:$markwonVersion"
        implementation "io.noties.markwon:ext-strikethrough:$markwonVersion"
        implementation "io.noties.markwon:linkify:$markwonVersion"
        implementation "io.noties.markwon:recycler:$markwonVersion"
        implementation 'com.google.guava:listenablefuture:9999.0-empty-to-avoid-conflict-with-guava'


        implementation project(":terminal-view")
        implementation project(":termux-shared")
    }

    defaultConfig {
        applicationId "com.agy.os"
        minSdkVersion project.properties.minSdkVersion.toInteger()
        targetSdkVersion project.properties.targetSdkVersion.toInteger()
        versionCode 112
        versionName "1.0.9"

        buildConfigField "String", "TERMUX_PACKAGE_VARIANT", "\"" + project.ext.packageVariant + "\""
        buildConfigField "boolean", "AGY_LITE_UPDATE", project.ext.liteUpdate.toString()

        manifestPlaceholders.TERMUX_PACKAGE_NAME = "com.agy.os"
        manifestPlaceholders.TERMUX_APP_NAME = "Antigravity"
        manifestPlaceholders.TERMUX_API_APP_NAME = "Termux:API"
        manifestPlaceholders.TERMUX_BOOT_APP_NAME = "Termux:Boot"
        manifestPlaceholders.TERMUX_FLOAT_APP_NAME = "Termux:Float"
        manifestPlaceholders.TERMUX_STYLING_APP_NAME = "Termux:Styling"
        manifestPlaceholders.TERMUX_TASKER_APP_NAME = "Termux:Tasker"
        manifestPlaceholders.TERMUX_WIDGET_APP_NAME = "Termux:Widget"

        externalNativeBuild {
            ndkBuild {
                def flags = ["-std=c11", "-Wall", "-Wextra", "-Werror", "-Os", "-fno-stack-protector", "-Wl,--gc-sections"]
                if (project.ext.liteUpdate) {
                    arguments "AGY_LITE_UPDATE=1"
                }
                cFlags(*flags)
            }
            ndk {
                abiFilters "arm64-v8a", "x86_64"
            }
        }
    }

    splits {
        abi {
            enable !project.ext.liteUpdate
            reset()
            include "arm64-v8a", "x86_64"
            universalApk true
        }
    }

    signingConfigs {
        debug {
            def debugKs = System.getenv("AGY_DEBUG_KEYSTORE_PATH")
            if (debugKs && file(debugKs).exists()) {
                storeFile file(debugKs)
                keyAlias System.getenv("AGY_DEBUG_KEY_ALIAS") ?: "androiddebugkey"
                storePassword System.getenv("AGY_DEBUG_KEYSTORE_PASSWORD") ?: "android"
                keyPassword System.getenv("AGY_DEBUG_KEY_PASSWORD") ?: "android"
            }
        }
        release {
            def ksPath = System.getenv("AGY_KEYSTORE_PATH")
            if (ksPath && file(ksPath).exists()) {
                storeFile file(ksPath)
                keyAlias System.getenv("AGY_KEY_ALIAS") ?: "antigravity"
                storePassword System.getenv("AGY_KEYSTORE_PASSWORD") ?: ""
                keyPassword System.getenv("AGY_KEY_PASSWORD") ?: ""
            }
            enableV1Signing true
            enableV2Signing true
            enableV3Signing true
        }
    }

    buildTypes {
        release {
            def ksPath = System.getenv("AGY_KEYSTORE_PATH")
            if (ksPath && file(ksPath).exists()) {
                signingConfig signingConfigs.release
            }
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }

        debug {
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = "1.8"
    }

    externalNativeBuild {
        ndkBuild {
            path "src/main/cpp/Android.mk"
        }
    }

    lint {
        disable 'ProtectedPermissions'
        abortOnError false
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging true
        }
    }

    sourceSets {
        main {
            jniLibs.srcDirs += "$buildDir/generated/agyJniLibs"
        }
    }

    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            if (variant.buildType.name == "release") {
                def abi = output.filters.find { it.filterType == "ABI" }?.identifier ?: "universal"
                outputFileName = project.ext.liteUpdate ? "AntigravityUpdate-v${variant.versionName}-${abi}-lite.apk" : "AntigravityStandalone-v${variant.versionName}-${abi}.apk"
            }
        }
    }

    buildFeatures {
        buildConfig true
    }
}

dependencies {
    testImplementation "junit:junit:4.13.2"
    testImplementation "org.robolectric:robolectric:4.10"
    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:1.1.5"
}

def patchBytesInPlace(byte[] data, byte[] oldSeq, byte[] newSeq) {
    if (data.length < oldSeq.length) return
    int limit = data.length - oldSeq.length
    for (int i = 0; i <= limit; ) {
        boolean match = true
        for (int j = 0; j < oldSeq.length; j++) {
            if (data[i + j] != oldSeq[j]) {
                match = false
                break
            }
        }
        if (match) {
            System.arraycopy(newSeq, 0, data, i, newSeq.length)
            i += oldSeq.length
        } else {
            i++
        }
    }
}

def patchBootstrapZip(File origZip, File outZip) {
    if (outZip.exists() && outZip.lastModified() >= origZip.lastModified() && outZip.length() > 0) {
        return
    }
    logger.quiet("Patching bootstrap " + origZip.name + " -> com.agy.os ...")
    byte[] oldBytes = "com.termux".getBytes("US-ASCII")
    byte[] newBytes = "com.agy.os".getBytes("US-ASCII")
    def tmpZip = new File(outZip.parentFile, outZip.name + ".tmp")
    def zis = new java.util.zip.ZipInputStream(new BufferedInputStream(new FileInputStream(origZip)))
    def zos = new java.util.zip.ZipOutputStream(new BufferedOutputStream(new FileOutputStream(tmpZip)))
    boolean ok = false
    try {
        byte[] buf = new byte[16384]
        def entry
        while ((entry = zis.nextEntry) != null) {
            def outEntry = new java.util.zip.ZipEntry(entry.name)
            zos.putNextEntry(outEntry)
            if (!entry.isDirectory()) {
                def baos = new ByteArrayOutputStream()
                int n
                while ((n = zis.read(buf)) != -1) {
                    baos.write(buf, 0, n)
                }
                byte[] content = baos.toByteArray()
                String lower = entry.name.toLowerCase(Locale.US)
                boolean isCompressed = lower.endsWith(".gz") || lower.endsWith(".xz") || lower.endsWith(".bz2") || lower.endsWith(".zst") || lower.endsWith(".zip")
                if (!isCompressed) {
                    patchBytesInPlace(content, oldBytes, newBytes)
                }
                zos.write(content)
            }
            zos.closeEntry()
        }
        ok = true
    } finally {
        zis.close()
        zos.close()
        if (!ok) {
            tmpZip.delete()
        }
    }
    java.nio.file.Files.move(
        tmpZip.toPath(),
        outZip.toPath(),
        java.nio.file.StandardCopyOption.REPLACE_EXISTING
    )
}

def downloadBootstrap(String arch, String expectedChecksum, String version) {
    def digest = java.security.MessageDigest.getInstance("SHA-256")
    def origFile = new File(projectDir, "src/main/cpp/bootstrap-" + arch + ".orig.zip")
    def patchedFile = new File(projectDir, "src/main/cpp/bootstrap-" + arch + ".zip")
    boolean needDownload = true
    if (origFile.exists()) {
        def buffer = new byte[8192]
        def input = new FileInputStream(origFile)
        try {
            while (true) {
                def readBytes = input.read(buffer)
                if (readBytes < 0) break
                digest.update(buffer, 0, readBytes)
            }
        } finally {
            input.close()
        }
        def checksum = new BigInteger(1, digest.digest()).toString(16)
        while (checksum.length() < 64) { checksum = "0" + checksum }
        if (checksum == expectedChecksum) {
            needDownload = false
        } else {
            origFile.delete()
        }
    }

    if (needDownload) {
        def remoteUrl = "https://github.com/termux/termux-packages/releases/download/bootstrap-" + version + "/bootstrap-" + arch + ".zip"
        logger.quiet("Downloading " + remoteUrl + " ...")
        origFile.parentFile.mkdirs()
        def out = new BufferedOutputStream(new FileOutputStream(origFile))
        def connection = new URL(remoteUrl).openConnection()
        connection.setConnectTimeout(15000)
        connection.setReadTimeout(60000)
        connection.setRequestProperty("User-Agent", "AntigravityAndroid-Build/1.0")
        connection.setInstanceFollowRedirects(true)
        def digestStream = new java.security.DigestInputStream(connection.inputStream, digest)
        out << digestStream
        out.close()

        def checksum = new BigInteger(1, digest.digest()).toString(16)
        while (checksum.length() < 64) { checksum = "0" + checksum }
        if (checksum != expectedChecksum) {
            origFile.delete()
            throw new GradleException("Wrong checksum for " + remoteUrl + ": expected: " + expectedChecksum + ", actual: " + checksum)
        }
    }

    patchBootstrapZip(origFile, patchedFile)
}

task downloadBootstraps() {
    doLast {
        if (!project.ext.liteUpdate) {
            def version = "2026.02.12-r1" + "%2B" + "apt.android-7"
            downloadBootstrap("aarch64", "ea2aeba8819e517db711f8c32369e89e7c52cee73e07930ff91185e1ab93f4f3", version)
            downloadBootstrap("x86_64", "b7fd0f2e3a4de534be3144f9f91acc768630fc463eaf134ab2e64c545e834f7a", version)
        }
    }
}

task buildAgyPatchNative() {
    doLast {
        def ndkDir = android.ndkDirectory
        def patchSrc = file("../tools/agy_patch.c")
        if (!patchSrc.exists() || ndkDir == null || !ndkDir.exists()) return
        def hostTag = org.gradle.internal.os.OperatingSystem.current().isWindows() ? "windows-x86_64" :
            (org.gradle.internal.os.OperatingSystem.current().isMacOsX() ? "darwin-x86_64" : "linux-x86_64")
        def binDir = new File(ndkDir, "toolchains/llvm/prebuilt/${hostTag}/bin")
        def stripBin = new File(binDir, org.gradle.internal.os.OperatingSystem.current().isWindows() ? "llvm-strip.exe" : "llvm-strip")
        def abis = [
            "arm64-v8a": "aarch64-linux-android24-clang",
            "x86_64": "x86_64-linux-android24-clang"
        ]
        abis.each { abi, clangName ->
            def prebuilt = file("src/main/jniLibs/${abi}/libagy_patch.so")
            def outDir = new File(buildDir, "generated/agyJniLibs/${abi}")
            def outFile = new File(outDir, "libagy_patch.so")
            if (prebuilt.exists()) {
                if (outFile.exists()) outFile.delete()
                return
            }
            def cc = new File(binDir, org.gradle.internal.os.OperatingSystem.current().isWindows() ? "${clangName}.cmd" : clangName)
            if (!cc.exists()) return
            if (outFile.exists() && outFile.lastModified() >= patchSrc.lastModified()) return
            outDir.mkdirs()
            def proc = new ProcessBuilder(
                cc.absolutePath, "-O2", "-std=c11", "-Wall", "-Wextra", "-Werror",
                "-fPIE", "-pie", patchSrc.absolutePath, "-o", outFile.absolutePath
            ).inheritIO().start()
            if (proc.waitFor() != 0) {
                throw new GradleException("Failed to compile libagy_patch.so for ${abi}")
            }
            if (stripBin.exists()) {
                def stripProc = new ProcessBuilder(stripBin.absolutePath, outFile.absolutePath).inheritIO().start()
                stripProc.waitFor()
            }
        }
    }
}

task buildZstdNative() {
    doLast {
        def ndkDir = android.ndkDirectory
        if (ndkDir == null || !ndkDir.exists()) return
        def hostTag = org.gradle.internal.os.OperatingSystem.current().isWindows() ? "windows-x86_64" :
            (org.gradle.internal.os.OperatingSystem.current().isMacOsX() ? "darwin-x86_64" : "linux-x86_64")
        def binDir = new File(ndkDir, "toolchains/llvm/prebuilt/${hostTag}/bin")
        def stripBin = new File(binDir, org.gradle.internal.os.OperatingSystem.current().isWindows() ? "llvm-strip.exe" : "llvm-strip")
        def abis = [
            "arm64-v8a": "aarch64-linux-android24-clang",
            "x86_64": "x86_64-linux-android24-clang"
        ]
        boolean allPrebuilt = abis.keySet().every { abi -> file("src/main/jniLibs/${abi}/libzstd_cli.so").exists() }
        if (allPrebuilt) return

        def zstdVersion = "1.5.7"
        def expectedSha = "eb33e51f49a15e023950cd7825ca74a4a2b43db8354825ac24fc1b7ee09e6fa3"
        def zstdCacheDir = new File(buildDir, "zstd-src")
        def zstdSrcDir = new File(zstdCacheDir, "zstd-${zstdVersion}")
        if (!zstdSrcDir.exists()) {
            zstdCacheDir.mkdirs()
            def tgz = new File(zstdCacheDir, "zstd-${zstdVersion}.tar.gz")
            if (!tgz.exists()) {
                def url = "https://github.com/facebook/zstd/releases/download/v${zstdVersion}/zstd-${zstdVersion}.tar.gz"
                logger.quiet("Downloading zstd ${zstdVersion} for local native build...")
                def conn = new URL(url).openConnection()
                conn.setConnectTimeout(15000)
                conn.setReadTimeout(60000)
                conn.setInstanceFollowRedirects(true)
                tgz.withOutputStream { out -> out << conn.inputStream }
            }
            def md = java.security.MessageDigest.getInstance("SHA-256")
            tgz.withInputStream { ins ->
                byte[] buf = new byte[8192]
                int r
                while ((r = ins.read(buf)) != -1) md.update(buf, 0, r)
            }
            def actual = new BigInteger(1, md.digest()).toString(16).padLeft(64, '0')
            if (actual != expectedSha) {
                tgz.delete()
                throw new GradleException("Wrong checksum for zstd-${zstdVersion}.tar.gz: ${actual}")
            }
            def tarProc = new ProcessBuilder("tar", "-xzf", tgz.absolutePath, "-C", zstdCacheDir.absolutePath).inheritIO().start()
            if (tarProc.waitFor() != 0) throw new GradleException("Failed to extract zstd source")
        }

        def cFiles = []
        ["lib/common", "lib/compress", "lib/decompress"].each { sub ->
            new File(zstdSrcDir, sub).listFiles()?.findAll { it.name.endsWith(".c") }?.each { cFiles << it.absolutePath }
        }
        ["zstdcli.c", "zstdcli_trace.c", "util.c", "timefn.c", "fileio.c", "fileio_asyncio.c"].each { f ->
            cFiles << new File(zstdSrcDir, "programs/${f}").absolutePath
        }

        abis.each { abi, clangName ->
            def prebuilt = file("src/main/jniLibs/${abi}/libzstd_cli.so")
            def outDir = new File(buildDir, "generated/agyJniLibs/${abi}")
            def outFile = new File(outDir, "libzstd_cli.so")
            if (prebuilt.exists()) {
                if (outFile.exists()) outFile.delete()
                return
            }
            if (outFile.exists() && outFile.length() > 0) return
            def cc = new File(binDir, org.gradle.internal.os.OperatingSystem.current().isWindows() ? "${clangName}.cmd" : clangName)
            if (!cc.exists()) return
            outDir.mkdirs()
            def cmd = [
                cc.absolutePath, "-O2", "-fPIE", "-pie", "-pthread",
                "-DZSTD_MULTITHREAD", "-DZSTD_NOBENCH", "-DZSTD_NODICT", "-DZSTD_DISABLE_ASM",
                "-I" + new File(zstdSrcDir, "lib").absolutePath,
                "-I" + new File(zstdSrcDir, "lib/common").absolutePath,
                "-I" + new File(zstdSrcDir, "lib/compress").absolutePath,
                "-I" + new File(zstdSrcDir, "lib/decompress").absolutePath,
                "-I" + new File(zstdSrcDir, "programs").absolutePath
            ] + cFiles + ["-o", outFile.absolutePath]
            def proc = new ProcessBuilder(cmd).inheritIO().start()
            if (proc.waitFor() != 0) throw new GradleException("Failed to compile libzstd_cli.so for ${abi}")
            if (stripBin.exists()) {
                new ProcessBuilder(stripBin.absolutePath, outFile.absolutePath).inheritIO().start().waitFor()
            }
        }
    }
}

afterEvaluate {
    android.applicationVariants.all { variant ->
        variant.preBuildProvider.get().dependsOn(buildAgyPatchNative)
        variant.preBuildProvider.get().dependsOn(buildZstdNative)
    }
    tasks.matching { it.name.startsWith("externalNativeBuild") || it.name.startsWith("configureNdkBuild") }.configureEach {
        dependsOn(downloadBootstraps)
    }
}
